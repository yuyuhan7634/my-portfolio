<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f1115;
            color: #e5e7eb;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: #1a1d24;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            padding: 48px 40px;
            text-align: center;
            border: 1px solid rgba(77, 184, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(77, 184, 255, 0.18);
        }

        .avatar {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4db8ff 0%, #007aff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 56px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(77, 184, 255, 0.35);
            border: 3px solid #4db8ff;
            outline: 1px solid rgba(77, 184, 255, 0.4);
            outline-offset: 4px;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 16px;
            color: #4db8ff;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .bio {
            font-size: 15px;
            color: #9ca3af;
            line-height: 1.8;
            margin-bottom: 36px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 24px;
            height: 2px;
            background: #4db8ff;
            border-radius: 2px;
        }

        .section-title::after {
            content: '';
            width: 24px;
            height: 2px;
            background: #4db8ff;
            border-radius: 2px;
        }

        .skills {
            margin-bottom: 40px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .skill-tag {
            padding: 8px 20px;
            background: rgba(77, 184, 255, 0.1);
            color: #4db8ff;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(77, 184, 255, 0.2);
            transition: all 0.2s ease;
            cursor: default;
        }

        .skill-tag:hover {
            background: #4db8ff;
            color: #0f1115;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(77, 184, 255, 0.3);
        }

        .contact {
            margin-bottom: 8px;
        }

        .contact-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: #23262d;
            border-radius: 10px;
            font-size: 14px;
            color: #d1d5db;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid rgba(77, 184, 255, 0.08);
        }

        .contact-item:hover {
            background: rgba(77, 184, 255, 0.12);
            border-color: rgba(77, 184, 255, 0.3);
            color: #4db8ff;
        }

        .contact-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #4db8ff 0%, #007aff 100%);
            margin: 0 auto 32px;
            border-radius: 2px;
        }

        /* 响应式设计 */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px 0;
            }

            .card {
                padding: 32px 20px;
                border-radius: 12px;
            }

            .avatar {
                width: 110px;
                height: 110px;
                font-size: 44px;
                margin-bottom: 20px;
            }

            .name {
                font-size: 26px;
            }

            .title {
                font-size: 14px;
                margin-bottom: 24px;
            }

            .bio {
                font-size: 14px;
                margin-bottom: 28px;
                padding: 0 4px;
            }

            .section-title {
                font-size: 16px;
            }

            .skill-tag {
                padding: 6px 16px;
                font-size: 13px;
            }

            .skill-tags {
                gap: 8px;
            }

            .contact-list {
                gap: 10px;
            }

            .contact-item {
                padding: 10px 14px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 28px 16px;
            }

            .name {
                font-size: 22px;
            }

            .avatar {
                width: 96px;
                height: 96px;
                font-size: 38px;
            }
        }
    </style>
</head>
<body>
